
[workspace]
resolver = "3"
members = [
  "crates/database",
  "crates/datafaker",
  "crates/base",
  "crates/design",
  "crates/excalidraw",
  "crates/monitor",
  "crates/toolbox",
]
default-members = ["crates/toolbox"]

[workspace.package]
edition = "2024"
version = "1.0.0"
authors = ["LittleGuest <2190975784@qq.com>"]


[workspace.dependencies]
base = { path = "crates/base" }
datafaker = { path = "crates/datafaker" }
database = { path = "crates/database" }
design = { path = "crates/design" }
excalidraw = { path = "crates/excalidraw" }
monitor = { path = "crates/monitor" }
database-core = { git = "https://github.com/LittleGuest/database", package = "database", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23.1"
data-encoding = "2.11.1"
encoding_rs = "0.8.32"
heck = "0.5.0"
hex = "0.4.3"
hmac = "0.13.0"
image_hasher = "3.1.1"
md-5 = "0.11.0"
qrcode-generator = "6.1.2"
quick-xml = { version = "0.42.0", features = ["serialize"] }
serde_yaml = "0.9.33"
sha1 = "0.11.0"
sha2 = "0.11.0"
sha3 = "0.12.0"
thiserror = "2.0.12"
toml = "1.1.6"
urlencoding = "2.1.3"
uuid = { version = "1.17.0", features = [
  "v1",
  "v3",
  "v4",
  "v5",
  "v6",
  "v7",
  "v8",
] }
image = { version = "0.25.6" }
time = { version = "0.3.41", features = ["formatting"] }
base-converter = "2.0.0"
chrono = { version = "0.4", features = ["clock"] }
tokio = { version = "1.45.0", features = ["full"] }
dirs = "7.0.0"
tera = { version = "2.4.0", default-features = false }
rust-embed = "8.7.2"
async-trait = "0.1.68"
regex = "1.8.4"
sqlx = { version = "0.8.6", features = [
  "runtime-tokio-native-tls",
  "any",
  "all-databases",
] }
fastrand = "2.5.0"
anyhow = "1.0.104"
Inflector = "0.11.4"
dashmap = "6.1.0"
rand = "0.10.3"
rand_regex = "0.19.0"
regex-syntax = "0.8.11"
indexmap = "2.14.2"
sysinfo = "0.39.6"
battery = "0.7.8"
gpui-kit = "0.7.1"
rfd = "0.17.2"
bs58 = "0.5.1"
similar = "3.2.0"
aes = "0.9.3"
des = "0.9.0"
ecb = { version = "0.2.1", features = ["alloc"] }
cbc = { version = "0.2.1", features = ["alloc"] }
sm2 = "0.14"
sm3 = "0.5"
sm4 = { version = "0.6", features = ["zeroize"] }
jsonschema = "0.58.6"
rqrr = "0.11"

[profile.release]
debug = false
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
debug-assertions = false
overflow-checks = false
